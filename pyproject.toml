[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectral-sdk"
version = "0.1.0"
description = "Python client for the Spectral sidecar"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_sdk"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
ignore = ["PYI034"]
